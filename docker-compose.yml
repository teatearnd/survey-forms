services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: survey-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://survey_app:survey_pass@db:5432/survey_forms?sslmode=disable
      DATABASE_URL_TEST: postgres://survey_app:survey_pass@db:5432/survey_forms_test?sslmode=disable
      REDIS_ADDRESS: redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: survey-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: survey_app
      POSTGRES_PASSWORD: survey_pass
      POSTGRES_DB: survey_forms
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey_app -d survey_forms"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: survey-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

volumes:
  db_data:
  redis_data: